apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mosalam-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mkourany92/Mosalam-Task4.git
    targetRevision: main
    path: gitops-repo/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: app-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true