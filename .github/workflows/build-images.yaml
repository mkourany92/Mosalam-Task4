name: Build And Push Images

on:
  push:
    branches:
      - main
    paths:
      - "Mosalam-Apps/frontend/**"
      - "Mosalam-Apps/backend/**"
      - ".github/workflows/build-images.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: Mosalam-Apps/frontend
          file: Mosalam-Apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mosalam-frontend:${{ steps.image.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/mosalam-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: Mosalam-Apps/backend
          file: Mosalam-Apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mosalam-backend:${{ steps.image.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/mosalam-backend:latest